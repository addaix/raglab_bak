[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "raglab_bak"
version = "0.1.2"
description = "Backend of a system to explore RAG operations (formerly published as raglab)"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "addaix" },
]
dependencies = [
    "dol",
    "config2py",
    "i2",
    "dill",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/addaix/raglab_bak"
Repository = "https://github.com/addaix/raglab_bak"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
# Disabled for now: this WIP backend's pre-existing test suite has broken /
# optional-dependency imports (e.g. tests/test_app.py imports a non-existent
# `app` module; wips/* tests need qdrant/langchain), and the legacy CI never
# ran pytest. Lint still runs, and publish is gated on validation, so enabling
# a known-failing sweep would block publishing. Re-enable once the suite is fixed.
enabled = false
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
# Disabled for now: GitHub Pages publishing needs gh-pages setup the legacy repo
# never had (its github-pages CI job was commented out). Not required for the
# PyPI publish goal; enable later when docs hosting is wired up.
enabled = false
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
